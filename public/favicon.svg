<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181d" />
      <stop offset="100%" stop-color="#0c0f12" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e06d53" />
      <stop offset="50%" stop-color="#e5a93c" />
      <stop offset="100%" stop-color="#7e9c89" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5" />

  <!-- Subtle grid element -->
  <path d="M12 20h40M12 32h40M12 44h40" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <path d="M20 12v40M32 12v40M44 12v40" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Stylized Modern Monogram "A" with tech angle -->
  <!-- Left leg -->
  <path d="M18 45 L28 19 C28.5 17.8 30 17 31.5 17 C33 17 34.5 17.8 35 19 L45 45" 
        stroke="url(#border-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Cross bar with code slash angle -->
  <path d="M23 35 L40 35" 
        stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Glowing Accent Tech Dot / Cursor -->
  <circle cx="45" cy="19" r="3.5" fill="#e06d53" filter="url(#glow)" />
  <circle cx="45" cy="19" r="2" fill="#ffffff" />
</svg>
